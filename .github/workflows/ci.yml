name: CI

on:
  pull_request:
  push:
    branches: [main, v3/build]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Historical findings are pinned in .gitleaksignore — this fails only
      # on NEW leaks. Never silence a fresh leak with a fingerprint; rotate
      # the credential instead.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Typecheck + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security fallback guard
        run: pnpm security:check

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Brand token drift test
        run: pnpm --filter @2hands/tailwind-config test

      - name: Unit tests (trust domain, brokers, adapters, memory filter)
        run: pnpm --filter @2hands/web test:unit

      - name: Golden path unit tests
        run: pnpm --filter @2hands/web test:golden

      - name: Computer + multi-agent integration (no DB required)
        run: |
          pnpm --filter @2hands/web test:integration:computer
          pnpm --filter @2hands/web test:integration:agents

  # Lint is intentionally NOT a required check yet: the legacy (non-v3)
  # surface carries 116 pre-existing errors. This job reports without
  # blocking; flip continue-on-error off once the legacy debt is paid.
  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  readiness-gate:
    name: Readiness Gate
    runs-on: ubuntu-latest
    needs: [test]
    # Only block production promotions — runs on main after tests pass,
    # and only when the deployment readiness endpoint is configured.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --filter @2hands/web

      - name: Wait for Vercel deployment
        # Give Vercel time to build and deploy before checking readiness
        run: sleep 120

      - name: Run readiness gate
        run: pnpm --filter @2hands/web check:readiness
        env:
          READINESS_CHECK_URL: ${{ secrets.READINESS_CHECK_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
