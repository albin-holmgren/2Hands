name: Bug report
description: Something is broken
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Never include credentials, tokens, or `.env`
        contents.** Security vulnerabilities go to security@2hands.ai — not here
        (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
      placeholder: Steps to reproduce, expected vs actual.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Web (apps/web)
        - Mobile (apps/mobile)
        - Managed computer / runner
        - Account Broker / secure input
        - Billing
        - Local demo mode setup
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node/pnpm versions, browser, COMPUTER_PROVIDER/BROWSER_PROVIDER values (never secrets).
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Redact anything sensitive before pasting.
      render: shell
