# fly.toml app configuration file generated for 2hands
# See https://fly.io/docs/reference/configuration/

app = "twohands-api"
primary_region = "arn"

[build]
  dockerfile = "infra/compose/Dockerfile"

[env]
  NODE_ENV = "production"
  API_HOST = "0.0.0.0"
  API_PORT = "3100"
  DATA_DIR = "/data"
  SANDBOX_PROVIDER = "e2b"
  AGENT_RUNTIME = "pi"
  PI_DEFAULT_PROVIDER = "vercel-gateway"
  PI_DEFAULT_MODEL = "openai/gpt-4.1-mini"
  RAKAZO_OPENAI_COMPAT_ALLOW_PUBLIC = "1"
  VERCEL_AI_GATEWAY_URL = "https://ai-gateway.vercel.sh/v1"
  WAKEUP_DRIVER = "graphile"

[processes]
  api = "pnpm --filter @rakazo/api start"
  worker = "pnpm --filter @rakazo/worker start"

[[mounts]]
  source = "twohands_data"
  destination = "/data"
  processes = ["api", "worker"]

[http_service]
  internal_port = 3100
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
  processes = ["api"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
  processes = ["worker"]
