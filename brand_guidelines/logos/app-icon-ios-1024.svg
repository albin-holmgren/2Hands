<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- iOS App Icon - Black background -->
  <rect width="1024" height="1024" rx="180" fill="#34322D"/>
  
  <!-- Icon perfectly centered -->
  <!-- Scaled 6.4x = 473.6px wide x 256px tall -->
  <!-- Center: (1024-473.6)/2 = 275.2, (1024-256)/2 = 384 -->
  <!-- Adjusted: 275.2 - 96 = 179.2, 384 - 96 = 288 -->
  <g transform="translate(179.2, 288) scale(6.4)">
    <rect x="15" y="20" width="8" height="35" rx="4" fill="#D97757"/>
    <rect x="27" y="15" width="8" height="35" rx="4" fill="#D97757"/>
    <rect x="39" y="20" width="8" height="35" rx="4" fill="#D97757"/>
    <rect x="57" y="20" width="8" height="35" rx="4" fill="#D97757"/>
    <rect x="69" y="15" width="8" height="35" rx="4" fill="#D97757"/>
    <rect x="81" y="20" width="8" height="35" rx="4" fill="#D97757"/>
  </g>
</svg>
