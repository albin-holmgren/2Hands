<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Black background -->
  <rect width="512" height="512" rx="90" fill="#34322D"/>
  
  <!-- Icon perfectly centered -->
  <!-- Logo bounds: width=96px, height=55px -->
  <!-- Scaled 3.2x = 236.8px wide x 128px tall -->
  <!-- Center: (512-236.8)/2 = 137.6, (512-128)/2 = 192 -->
  <!-- Adjusted: 137.6 - 48 = 89.6, 192 - 48 = 144 -->
  <g transform="translate(89.6, 144) scale(3.2)">
    <rect x="15" y="20" width="8" height="35" rx="4" fill="#D97757"/>
    <rect x="27" y="15" width="8" height="35" rx="4" fill="#D97757"/>
    <rect x="39" y="20" width="8" height="35" rx="4" fill="#D97757"/>
    <rect x="57" y="20" width="8" height="35" rx="4" fill="#D97757"/>
    <rect x="69" y="15" width="8" height="35" rx="4" fill="#D97757"/>
    <rect x="81" y="20" width="8" height="35" rx="4" fill="#D97757"/>
  </g>
</svg>
