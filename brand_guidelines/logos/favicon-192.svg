    <rect x="27" y="15" width="8" height="35" rx="4" fill="#D97757"/>
    <rect x="39" y="20" width="8" height="35" rx="4" fill="#D97757"/>
    <rect x="57" y="20" width="8" height="35" rx="4" fill="#D97757"/>
    <rect x="69" y="15" width="8" height="35" rx="4" fill="#D97757"/>
    <rect x="81" y="20" width="8" height="35" rx="4" fill="#D97757"/>
  </g>
</svg>
